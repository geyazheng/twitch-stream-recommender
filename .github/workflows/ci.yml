name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Unit and integration tests; the integration tests start MySQL with Testcontainers,
      # which uses the Docker daemon that GitHub-hosted runners provide
      - run: ./gradlew build

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      # The built app is committed, so the backend image needs no Node. The build is
      # reproducible, so any difference means someone changed frontend/ without rebuilding.
      - name: Check the committed build is up to date
        run: |
          if [ -n "$(git status --porcelain -- ../src/main/resources/public)" ]; then
            git status --short -- ../src/main/resources/public
            echo "::error::src/main/resources/public is out of date. Run 'npm run build' in frontend/ and commit the result."
            exit 1
          fi
