plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.miazheng'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.3"
    }
    dependencies {
        dependency 'com.nimbusds:nimbus-jose-jwt:9.37.4'
        dependency 'org.bouncycastle:bcprov-jdk18on:1.85'
    }
}

// Spring Boot 3.5.16 is the latest 3.5 release. These patch releases, and the two pinned
// above, fix CVEs published since then; drop them when moving to Spring Boot 4.
// spring-webmvc 6.2.19 still has CVE-2026-47890 and CVE-2026-47884, fixed only in Spring
// Framework 7. They need SSE fragment rendering and XsltView, which this app does not use.
ext['tomcat.version'] = '10.1.61'
ext['jackson-bom.version'] = '2.21.7'
ext['log4j2.version'] = '2.25.5'
ext['commons-lang3.version'] = '3.18.0'

dependencies {
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.2'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.security:spring-security-oauth2-client'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
