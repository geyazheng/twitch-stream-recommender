spring:
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
  cloud:
    openfeign:
      oauth2:
        enabled: true
        clientRegistrationId: twitch
      client:
        config:
          twitch-api:
            url: https://api.twitch.tv/helix
            loggerLevel: basic
            default-request-headers:
              Client-Id: "${TWITCH_CLIENT_ID}"
  security:
    oauth2:
      client:
        registration:
          twitch:
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_post
            client-id: "${TWITCH_CLIENT_ID}"
            client-secret: "${TWITCH_CLIENT_SECRET}"
        provider:
          twitch:
            token-uri: https://id.twitch.tv/oauth2/token
  datasource:
    url: jdbc:mysql://${DATABASE_URL:localhost}:${DATABASE_PORT:3306}/twitch?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${DATABASE_INIT:always}
      schema-locations: "classpath:database-init.sql"
  cache:
    caffeine:
      spec: expireAfterWrite=1m

server:
  servlet:
    session:
      cookie:
        # Chrome already treats cookies without SameSite as Lax; Firefox and Safari do not.
        # Lax keeps the session cookie off cross-site POST/DELETE, on top of the CSRF token.
        same-site: lax

logging:
  level:
    com.miazheng.twitch.external.TwitchApiClient: ${TWITCH_LOG_LEVEL:INFO}
